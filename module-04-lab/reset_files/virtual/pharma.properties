# How the virtual repository reaches the warehouse extract.
# H2 is a SQL engine that runs inside the GraphDB process. The script it runs on each connection defines one
# SQL view per CSV file in the warehouse folder, so every query reads the files as they are at that moment.
jdbc.url=jdbc:h2:mem:pharma;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM '/warehouse/h2_views.sql'
jdbc.driver=org.h2.Driver
jdbc.user=sa
jdbc.password=
