# Module 5 lab: one container, PostgreSQL 17 with the pgvector extension.
# Start: docker compose up -d      Stop: docker compose down      Remove the data as well: docker compose down -v
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: esi-pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: policy
    ports:
      - "5435:5432"      # host port 5435, so that a PostgreSQL already installed on the laptop is not disturbed
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d policy"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pg-data:
